# NeverMind — Render blueprint (Docker web service)
# Deploy: Render → New → Blueprint → paste this repo
services:
  - type: web
    name: nevermind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NEVERMIND_PORT
        value: "8317"
      # Optional GitHub login on the deployed host:
      # - key: GITHUB_CLIENT_ID
      #     sync: false
      # - key: GITHUB_CLIENT_SECRET
      #     sync: false
    # Persistent disk needs a PAID Render plan — blueprint validation FAILS on
    # free tier with it. Re-enable after upgrading; free tier still works
    # (SQLite lives in the container, resets on re-deploy):
    # disk:
    #   name: nevermind-data
    #   mountPath: /app/data
    #   sizeGB: 1
