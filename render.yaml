# NeverMind — Render blueprint (Docker web service)
# Deploy: Render → New → Blueprint → paste this repo
services:
  - type: web
    name: nevermind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NEVERMIND_PORT
        value: "8317"
      # Optional GitHub login on the deployed host:
      # - key: GITHUB_CLIENT_ID
      #     sync: false
      # - key: GITHUB_CLIENT_SECRET
      #     sync: false
    disk:
      name: nevermind-data
      mountPath: /app/data
      sizeGB: 1
